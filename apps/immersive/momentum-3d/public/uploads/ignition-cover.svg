<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f0810" stroke-width="1"/>
    </pattern>

    <radialGradient id="bgGlow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0f1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rocketFill" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ff8fab"/>
      <stop offset="55%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <linearGradient id="flameOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ff8c00" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#ffd93d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffd93d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <filter id="rocketGlow" x="-60%" y="-40%" width="220%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="flameGlow" x="-120%" y="-30%" width="340%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="timerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0a0a1a"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <ellipse cx="400" cy="195" rx="340" ry="215" fill="url(#bgGlow)"/>

  <!-- Velocity streaks (exhaust trails going down) -->
  <line x1="400" y1="270" x2="400" y2="395" stroke="#f43f5e" stroke-width="2.5" opacity="0.22" stroke-dasharray="10,7">
    <animate attributeName="stroke-dashoffset" values="0;34" dur="0.7s" repeatCount="indefinite"/>
  </line>
  <line x1="386" y1="278" x2="372" y2="390" stroke="#f43f5e" stroke-width="1.5" opacity="0.14" stroke-dasharray="7,9">
    <animate attributeName="stroke-dashoffset" values="0;32" dur="0.85s" repeatCount="indefinite"/>
  </line>
  <line x1="414" y1="278" x2="428" y2="390" stroke="#f43f5e" stroke-width="1.5" opacity="0.14" stroke-dasharray="7,9">
    <animate attributeName="stroke-dashoffset" values="0;32" dur="0.75s" repeatCount="indefinite"/>
  </line>
  <line x1="368" y1="288" x2="344" y2="400" stroke="#ff8c00" stroke-width="1" opacity="0.1" stroke-dasharray="5,11">
    <animate attributeName="stroke-dashoffset" values="0;32" dur="1.05s" repeatCount="indefinite"/>
  </line>
  <line x1="432" y1="288" x2="456" y2="400" stroke="#ff8c00" stroke-width="1" opacity="0.1" stroke-dasharray="5,11">
    <animate attributeName="stroke-dashoffset" values="0;32" dur="0.95s" repeatCount="indefinite"/>
  </line>

  <!-- Exhaust flame (drawn below rocket) -->
  <g filter="url(#flameGlow)">
    <!-- Outer flame -->
    <path d="M 372 262 C 352 288 346 325 358 355 C 370 372 388 378 400 378 C 412 378 430 372 442 355 C 454 325 448 288 428 262 Z"
      fill="url(#flameOuter)" opacity="0.45">
      <animate attributeName="d"
        values="M 372 262 C 352 288 346 325 358 355 C 370 372 388 378 400 378 C 412 378 430 372 442 355 C 454 325 448 288 428 262 Z;
                M 375 262 C 350 292 342 330 355 358 C 367 374 386 381 400 381 C 414 381 433 374 445 358 C 458 330 450 292 425 262 Z;
                M 372 262 C 352 288 346 325 358 355 C 370 372 388 378 400 378 C 412 378 430 372 442 355 C 454 325 448 288 428 262 Z"
        dur="0.28s" repeatCount="indefinite"/>
    </path>
    <!-- Core flame -->
    <path d="M 389 264 C 382 282 379 312 385 340 C 390 357 396 366 400 368 C 404 366 410 357 415 340 C 421 312 418 282 411 264 Z"
      fill="url(#flameCore)" opacity="0.8">
      <animate attributeName="d"
        values="M 389 264 C 382 282 379 312 385 340 C 390 357 396 366 400 368 C 404 366 410 357 415 340 C 421 312 418 282 411 264 Z;
                M 391 264 C 383 284 380 315 386 343 C 391 360 397 369 400 371 C 403 369 409 360 414 343 C 420 315 417 284 409 264 Z;
                M 389 264 C 382 282 379 312 385 340 C 390 357 396 366 400 368 C 404 366 410 357 415 340 C 421 312 418 282 411 264 Z"
        dur="0.22s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Rocket body (centered at 400, 170) -->
  <g transform="translate(400, 170)" filter="url(#rocketGlow)">
    <!-- Left fin -->
    <path d="M -24 52 L -42 84 L -20 68 Z" fill="#881337" stroke="#f43f5e" stroke-width="1.5" opacity="0.9"/>
    <!-- Right fin -->
    <path d="M 24 52 L 42 84 L 20 68 Z" fill="#881337" stroke="#f43f5e" stroke-width="1.5" opacity="0.9"/>
    <!-- Body -->
    <path d="M 0 -80 C 20 -64 26 -32 26 0 C 26 32 24 58 20 74 L -20 74 C -24 58 -26 32 -26 0 C -26 -32 -20 -64 0 -80 Z"
      fill="url(#rocketFill)" stroke="#ff8fab" stroke-width="1.5" opacity="0.95"/>
    <!-- Window ring -->
    <circle cx="0" cy="-12" r="14" fill="#1a0510" stroke="#f43f5e" stroke-width="2.5" opacity="0.9"/>
    <circle cx="0" cy="-12" r="9" fill="url(#windowGlow)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.45;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Nozzle -->
    <path d="M -20 74 L -25 86 L 25 86 L 20 74 Z" fill="#4c0519" stroke="#f43f5e" stroke-width="1" opacity="0.85"/>
    <!-- Body highlight stripe -->
    <line x1="-8" y1="-70" x2="-10" y2="60" stroke="#ff8fab" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
  </g>

  <!-- Timer outer ring (faint track) -->
  <circle cx="400" cy="170" r="116" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.18"/>
  <!-- Timer ticks -->
  <g opacity="0.35">
    <line x1="400" y1="50" x2="400" y2="60" stroke="#f43f5e" stroke-width="2.5" transform="rotate(0 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="57" stroke="#f43f5e" stroke-width="1.5" transform="rotate(30 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="57" stroke="#f43f5e" stroke-width="1.5" transform="rotate(60 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="60" stroke="#f43f5e" stroke-width="2.5" transform="rotate(90 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="57" stroke="#f43f5e" stroke-width="1.5" transform="rotate(120 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="57" stroke="#f43f5e" stroke-width="1.5" transform="rotate(150 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="60" stroke="#f43f5e" stroke-width="2.5" transform="rotate(180 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="57" stroke="#f43f5e" stroke-width="1.5" transform="rotate(210 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="57" stroke="#f43f5e" stroke-width="1.5" transform="rotate(240 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="60" stroke="#f43f5e" stroke-width="2.5" transform="rotate(270 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="57" stroke="#f43f5e" stroke-width="1.5" transform="rotate(300 400 170)"/>
    <line x1="400" y1="50" x2="400" y2="57" stroke="#f43f5e" stroke-width="1.5" transform="rotate(330 400 170)"/>
  </g>
  <!-- Animated timer arc -->
  <circle cx="400" cy="170" r="116" fill="none" stroke="#f43f5e" stroke-width="2.5"
    stroke-dasharray="729" stroke-dashoffset="729"
    stroke-linecap="round"
    transform="rotate(-90 400 170)"
    filter="url(#timerGlow)"
    opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="729;0;729" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- 600s label above rocket -->
  <text x="400" y="44" text-anchor="middle" font-family="monospace" font-size="11" fill="#f43f5e" font-weight="bold" opacity="0.75" letter-spacing="2">600s</text>

  <!-- Floating spark particles — left side -->
  <circle cx="175" cy="110" r="3" fill="#f43f5e" filter="url(#pGlow)" opacity="0.65">
    <animate attributeName="cy" values="110;93;110" dur="3.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0.15;0.65" dur="3.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="135" cy="175" r="2.5" fill="#ff8c00" filter="url(#pGlow)" opacity="0.5">
    <animate attributeName="cy" values="175;158;175" dur="4.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="215" cy="72" r="2" fill="#f43f5e" filter="url(#pGlow)" opacity="0.4">
    <animate attributeName="cy" values="72;56;72" dur="3.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.08;0.4" dur="3.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="240" r="2.5" fill="#ffd93d" filter="url(#pGlow)" opacity="0.4">
    <animate attributeName="cy" values="240;224;240" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.08;0.4" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="48" r="2" fill="#ff6b8a" filter="url(#pGlow)" opacity="0.35">
    <animate attributeName="cy" values="48;33;48" dur="5.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.07;0.35" dur="5.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="155" r="2" fill="#f43f5e" filter="url(#pGlow)" opacity="0.3">
    <animate attributeName="cy" values="155;140;155" dur="5.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.06;0.3" dur="5.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating spark particles — right side -->
  <circle cx="625" cy="106" r="3" fill="#f43f5e" filter="url(#pGlow)" opacity="0.65">
    <animate attributeName="cy" values="106;89;106" dur="3.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0.15;0.65" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="665" cy="172" r="2.5" fill="#ff8c00" filter="url(#pGlow)" opacity="0.5">
    <animate attributeName="cy" values="172;155;172" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="585" cy="68" r="2" fill="#f43f5e" filter="url(#pGlow)" opacity="0.4">
    <animate attributeName="cy" values="68;52;68" dur="4.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.08;0.4" dur="4.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="705" cy="236" r="2.5" fill="#ffd93d" filter="url(#pGlow)" opacity="0.4">
    <animate attributeName="cy" values="236;220;236" dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.08;0.4" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="530" cy="44" r="2" fill="#ff6b8a" filter="url(#pGlow)" opacity="0.35">
    <animate attributeName="cy" values="44;29;44" dur="4.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.07;0.35" dur="4.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="152" r="2" fill="#f43f5e" filter="url(#pGlow)" opacity="0.3">
    <animate attributeName="cy" values="152;137;152" dur="5.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.06;0.3" dur="5.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Launch pad base lines -->
  <line x1="185" y1="305" x2="356" y2="275" stroke="#f43f5e" stroke-width="1" opacity="0.18" stroke-dasharray="6,5"/>
  <line x1="615" y1="305" x2="444" y2="275" stroke="#f43f5e" stroke-width="1" opacity="0.18" stroke-dasharray="6,5"/>
  <rect x="344" y="300" width="112" height="4" rx="2" fill="#f43f5e" opacity="0.12"/>
  <rect x="366" y="293" width="68" height="6" rx="3" fill="#f43f5e" opacity="0.08"/>

  <!-- Typography -->
  <text x="400" y="360" font-family="monospace" font-size="30" font-weight="bold" fill="#f43f5e"
    text-anchor="middle" letter-spacing="5" filter="url(#textGlow)" opacity="0.3">
    IGNITE MOMENTUM
  </text>
  <text x="400" y="360" font-family="monospace" font-size="30" font-weight="bold" fill="#f43f5e"
    text-anchor="middle" letter-spacing="5">
    IGNITE MOMENTUM
  </text>
  <text x="400" y="393" font-family="monospace" font-size="12" font-weight="bold" fill="#ff8c00"
    text-anchor="middle" letter-spacing="7" opacity="0.8">
    QUICK LAUNCH // IGN-01
  </text>

  <!-- Scanning line -->
  <rect width="800" height="2" fill="#f43f5e" opacity="0.06">
    <animate attributeName="y" values="0;450;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accents -->
  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#2a0f18" stroke-width="2"/>
  <path d="M 740 20 L 780 20 L 780 60" fill="none" stroke="#2a0f18" stroke-width="2"/>
  <path d="M 780 390 L 780 430 L 740 430" fill="none" stroke="#2a0f18" stroke-width="2"/>
  <path d="M 60 430 L 20 430 L 20 390" fill="none" stroke="#2a0f18" stroke-width="2"/>
</svg>
