name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm install
      working-directory: apps/immersive/momentum-3d

    - name: Typecheck
      run: npm run typecheck
      working-directory: apps/immersive/momentum-3d

    - name: Run tests
      run: npm test
      working-directory: apps/immersive/momentum-3d
